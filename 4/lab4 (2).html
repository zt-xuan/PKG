<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>基础光栅算法演示 - 实验4</title>
<style>
    body { font-family: "Segoe UI", Arial; margin: 0; padding: 10px; background: #f5f5f5; }
    canvas { border: 1px solid #333; background: #fff; display: block; margin-bottom: 10px; }
    .panel { background: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    button { margin: 4px; padding: 6px 12px; }
    input { width: 60px; }
    label { margin-right: 8px; }
</style>
</head>
<body>

<h2>🖥️ 基础光栅算法演示（实验 4）</h2>

<div class="panel">
    <label>起点 x0: <input id="x0" value="2"></label>
    <label>y0: <input id="y0" value="2"></label>
    <label>终点 x1: <input id="x1" value="18"></label>
    <label>y1: <input id="y1" value="10"></label>
    <label>圆心 x: <input id="cx" value="10"></label>
    <label>y: <input id="cy" value="10"></label>
    <label>半径 r: <input id="r" value="7"></label>
</div>

<div class="panel">
    <strong>线段算法：</strong><br>
    <button onclick="draw('step')">逐点算法</button>
    <button onclick="draw('dda')">DDA</button>
    <button onclick="draw('bresenham')">Bresenham 直线</button>

    <br><br>
    <strong>圆算法：</strong><br>
    <button onclick="draw('circle')">Bresenham 圆</button>
    <br><br>
    <button onclick="clearCanvas()">清空</button>
    <label>缩放：
        <input id="scale" type="number" value="20" min="5" max="60" onchange="redraw()">
    </label>
</div>

<canvas id="cv"></canvas>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let scale = 20;
let lastMode = 'bresenham';

function resize() {
    canvas.width = 800;
    canvas.height = 600;
}
resize();

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
}

function drawGrid() {
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < canvas.width; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    // 坐标轴
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
}

function pixel(x, y, color = '#000', alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(canvas.width/2 + x*scale, canvas.height/2 - y*scale, scale, scale);
    ctx.globalAlpha = 1;
}

// 1. 逐点算法
function stepAlgorithm(x0, y0, x1, y1) {
    const pixels = [];
    const dx = x1 - x0, dy = y1 - y0;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        pixels.push([Math.round(x0 + t*dx), Math.round(y0 + t*dy)]);
    }
    return pixels;
}

// 2. DDA
function ddaAlgorithm(x0, y0, x1, y1) {
    const pixels = [];
    const dx = x1 - x0, dy = y1 - y0;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    const xInc = dx / steps, yInc = dy / steps;
    let x = x0, y = y0;
    for (let i = 0; i <= steps; i++) {
        pixels.push([Math.floor(x), Math.floor(y)]);
        x += xInc; y += yInc;
    }
    return pixels;
}


// 3. Bresenham 直线
function bresenhamLine(x0, y0, x1, y1) {
    const pixels = [];
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let x = x0, y = y0;
    while (true) {
        pixels.push([x, y]);
        if (x === x1 && y === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x += sx; }
        if (e2 < dx) { err += dx; y += sy; }
    }
    return pixels;
}



// 6. Bresenham 圆
function bresenhamCircle(cx, cy, r) {
    const pixels = [];
    let x = 0, y = r;
    let d = 3 - 2*r;
    function plotCirclePoints(x, y) {
        pixels.push([cx+x, cy+y],[cx-x, cy+y],[cx+x, cy-y],[cx-x, cy-y],
                    [cx+y, cy+x],[cx-y, cy+x],[cx+y, cy-x],[cx-y, cy-x]);
    }
    while (y >= x) {
        plotCirclePoints(x, y);
        x++;
        if (d > 0) { y--; d += 4*(x - y) + 10; }
        else d += 4*x + 6;
    }
    return pixels;
}

// 主绘制函数
function draw(mode) {
    clearCanvas();
    scale = parseInt(document.getElementById('scale').value);
    lastMode = mode;
    const x0 = parseInt(document.getElementById('x0').value);
    const y0 = parseInt(document.getElementById('y0').value);
    const x1 = parseInt(document.getElementById('x1').value);
    const y1 = parseInt(document.getElementById('y1').value);
    const cx = parseInt(document.getElementById('cx').value);
    const cy = parseInt(document.getElementById('cy').value);
    const r = parseInt(document.getElementById('r').value);

    const t0 = performance.now();

    if (mode === 'step') {
        const pts = stepAlgorithm(x0, y0, x1, y1);
        pts.forEach(p => pixel(p[0], p[1], '#d32f2f'));
    }
    else if (mode === 'dda') {
        const pts = ddaAlgorithm(x0, y0, x1, y1);
        pts.forEach(p => pixel(p[0], p[1], '#1976d2'));
    }
    else if (mode === 'bresenham') {
        const pts = bresenhamLine(x0, y0, x1, y1);
        pts.forEach(p => pixel(p[0], p[1], '#388e3c'));
    }
    else if (mode === 'castle') {
        const pts = castlePitway(x0, y0, x1, y1);
        pts.forEach(p => pixel(p[0], p[1], '#7b1fa2'));
    }
    else if (mode === 'wu') {
        const pts = wuLine(x0, y0, x1, y1);
        pts.forEach(p => pixel(p[0], p[1], '#000', p[2]));
    }
    else if (mode === 'circle') {
        const pts = bresenhamCircle(cx, cy, r);
        pts.forEach(p => pixel(p[0], p[1], '#f57c00'));
    }

    const t1 = performance.now();
    ctx.fillStyle = '#000';
    ctx.font = '14px Arial';
    ctx.fillText(`算法: ${mode} | 耗时: ${(t1-t0).toFixed(3)} ms`, 10, 20);
}

function redraw() {
    scale = parseInt(document.getElementById('scale').value);
    clearCanvas();
    draw(lastMode);
}

clearCanvas();
</script>

</body>
</html>
